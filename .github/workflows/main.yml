name: Deploy React App

on:
  push:
    branches: [ "main", "updating" ]

permissions:
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18

      - run: npm install
      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./build
      - name: Finding path
        run: pwd
      - name: build docker images
        run: 
          docker build -t ${{ secrets.DOCKER_USERNAME }}/portfolio -f dockerfile .
          
      - name: Docker Login
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      # Push Images
      - name: Push Docker Images
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/portfolio
      - name: Configure AWS Credentials
        run: |
          aws configure set aws_access_key_id ${{ secrets.AWS_ACCESS_KEY }}
          aws configure set aws_secret_access_key ${{ secrets.AWS_SECRET_KEY }}

      - name: AWS ECR login
        run: aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin 585768189252.dkr.ecr.us-east-1.amazonaws.com
      - name: Tgging image
        run: docker tag pranjulrathour/portfolio:latest 585768189252.dkr.ecr.us-east-1.amazonaws.com/pranjulrathour/portfolio:latest
      - name: Pushing image
        run: docker push 585768189252.dkr.ecr.us-east-1.amazonaws.com/pranjulrathour/portfolio:latest
      

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
      
