apiVersion: argocd-image-updater.argoproj.io/v1alpha1
kind: ImageUpdater

metadata:
  name: portfolio
  namespace: argocd

spec:
  applicationRefs:
    - namePattern: portfolio

      images:
        - alias: portfolio
          imageName: pranjulrathour/portfolio
          manifestTargets:
            helm:
              name: image.repository
              tag: image.tag

      commonUpdateSettings:
        updateStrategy: semver
        allowTags: "*"

      writeBackConfig:
        method: git:secret:argocd/my-git-creds